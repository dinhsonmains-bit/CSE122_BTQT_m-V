<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #0f172a;
            color: #e2e8f0;
            text-align: center;
            font-family: sans-serif;
            padding: 20px;

        }

        p{
            color:#94a3b8;
            font-size: 14px;
            margin-bottom: 25px;

        }
        main{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            max-width: 900px ;
            margin: auto;

        }

        figure{
            background: #1e293b;
            margin: 0;
            border-radius: 8px;
            overflow: hidden;
            margin: auto;
        }
        img{
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        figcaption{
            color: #cbd5e1;
            font-size: 13px;
            padding: 10px 12px;
        }


    </style>
</head>
<body>
    <h1>Thư viện ảnh Việt Nam</h1>
    <p>Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>

    <main>
        <figure>
            <img src="1-vinh-ha-long.jpg" alt="">
            <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>
         <figure>
            <img src="2-son-doong.jpg" alt="">
            <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
        </figure>
         <figure>
            <img src="3-thac-ban-gioc.jpg" alt="">
            <figcaption>Hình 3. Thác Bản Giốc/figcaption>
        </figure>
         <figure>
            <img src="4-fansipan.jpg" alt="">
            <figcaption>Hình 4. Fansipan</figcaption>
        </figure>
         <figure>
            <img src="5-mekong.jpg" alt="">
            <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
        </figure>
         <figure>
            <img src="6-phong-nha.jpg" alt="">
            <figcaption>Hình 6. Động Phong Nha</figcaption>
        </figure>
    </main>




</body>
</html>
