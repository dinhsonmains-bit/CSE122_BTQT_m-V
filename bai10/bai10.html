<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #EEF2F6;
            padding: 30px;
            font-family: sans-serif;
        }
        form{
            max-width: 650px;
            margin: auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px;
            overflow: hidden;
        }
        header{
            background:#0f766e ;
            color: white;
            padding: 20px 25px;

        }
        header h1{
            margin: 0 0 5px 0;
            font-size: 22px;
        }
        header p{
            margin: 0;
            font-size: 14px;
        }
        section{
            padding: 25px;
        }
        .grid-2{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        label{
            display: block;
            color: #334155;
            font-weight: bold;
            font-size: 13px;
            margin: 10px 0 5px 0;
        }
        input:not([typ="checkbox"]),select,textarea{
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            
        }
        button{
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer
            ;
            margin-top: 15px;
        }
        .btn-gui{
            background:#0f766e ;
            color: white;
        }
        .btn-nhaplai{
            background: white;
            
        }
    </style>
</head>
<body>
    <form>
        <header>
            <h1>Liên hệ với chúng tôi</h1>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </header>

        <section>
            <div class="grid-2">
                <div>
                    <label>họ và tên
                    </label>
                    <input type="text" value="Mai Đình Sơn">
                </div>
                <div>
                    <label>email</label>
                    <input type="text" value="2551170944@e.tlu.edu.vn">
                </div>
                <div>
                    <label>Số điện thoại</label>
                    <input type="text" value="0919707103">
                </div>
                <div>
                    <label>Chủ đề</label>
                    <select>
                        <option value="hỏi về khóa học"></option>
                    </select>
                </div>
                <div>
                    <label>Nội dung</label>
                    <textarea   rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ</textarea>

                </div>
                <label>
                    <input type="checkbox" checked>Tôi đồng ý nhận email phản hồi.
                </label>

                <button type="submit" class="btn-gui">Gửi liên hệ</button>
                  <button type="submit" class="btn-nhap">Nhập lại</button>
            </div>

        </section>
    </form>
</body>
</html>
