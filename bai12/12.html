<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: url(Nen.gif);
            text-align: center;
            padding: 30px;

        
        }
        main{
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px;

    
        }
        section{
            border: 1px solid #ccc;
            background: white;
            border-radius: 8px;
            padding: 20px;


        }

        .do{
            color: #c62828;
            margin: 5px 0;

        }
        h1{
            color: #c62828;
            font-size: 52px;
            margin: 5px 0;
        }
        h2
        {
            color: #1565C0;
            font-size: 18px;
            margin: 5px 0;
            font-weight: normal;

        }
        form{
            border: 2px solid #1565C0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;

        }
    input{
        width: 60px;
        padding: 5px;
        text-align: center;
        display: block;
    }
    button{
        background: #546e7a;
        color: white;
        border-radius: 8px;
        padding: 10px;
    }

    </style>
</head>
<body>
    <main>
        <section>
            <div class="do">2026</div>
            <h2>Tháng 12</h2>
            <h1>24</h1>
            <h2>Thứ hai</h2>

        </section>
        <p>Chào buổi sáng!</p>

        <form>
            <label>Ngày<input type="text" value="24"></label>
        <label>Tháng<input type="text" value="12"></label>
        <label>Năm<input type="text" value="2026"></label>
            <button type="button">In<br>lịch</button>
    </form>
    </main>
</body>
</html>
